<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>集锦</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="visually-hidden" href="#search">跳到搜索</a>
  <div class="hero">
    <h1 class="wordmark">集锦</h1>
    <div class="clock" id="clock"></div>
    <div class="date" id="date"></div>
    <form id="search-form" class="search-form" role="search">
      <label class="visually-hidden" for="search">搜索收藏或网页</label>
      <input id="search" type="search" placeholder="搜索收藏，或选择引擎后回车" autocomplete="off" spellcheck="false">
      <div class="engines" id="engines" role="tablist" aria-label="搜索范围">
        <button type="button" role="tab" data-engine="library" aria-selected="true">收藏</button>
        <button type="button" role="tab" data-engine="bing" aria-selected="false">必应</button>
        <button type="button" role="tab" data-engine="google" aria-selected="false">谷歌</button>
        <button type="button" role="tab" data-engine="scholar" aria-selected="false">学术</button>
      </div>
    </form>
    <button type="button" id="edit-toggle" aria-pressed="false">编辑</button>
  </div>

  <section class="pins-wrap" aria-label="常用">
    <h2 class="section-label">常用 <span class="hint">可在编辑模式改</span></h2>
    <ul id="pins"></ul>
    <div class="editor" id="editor">
      <form class="editor-form" id="add-form">
        <label class="field">
          <span>标题</span>
          <input id="add-title" type="text" placeholder="短名" required>
        </label>
        <label class="field">
          <span>网址</span>
          <input id="add-url" type="url" placeholder="https://" required>
        </label>
        <div class="editor-actions">
          <button type="submit">添加</button>
          <button type="button" id="reset-pins">恢复默认</button>
          <span id="add-status"></span>
        </div>
      </form>
    </div>
  </section>

  <div id="results"></div>
  <nav class="cats" id="groups" aria-label="分类"></nav>
  <p class="status" id="status"></p>

  <!--
    手动编辑常用列表：改下面的 DEFAULT_PINS 后刷新即可。
    若已在页面里点过「编辑」，浏览器会以 localStorage（键名 jijin-pins）为准；
    可用「恢复默认」清掉本地记录，回到这个数组。
  -->
  <script>
    window.DEFAULT_PINS = [
      { title: "Windy", url: "https://www.windy.com/?39.991,116.289,5" },
      { title: "earth", url: "https://earth.nullschool.net/zh-cn/" },
      { title: "Tropical Tidbits", url: "https://www.tropicaltidbits.com/analysis/models/" },
      { title: "风云四号", url: "http://rsapp.nsmc.org.cn/geofy/" },
      { title: "天气分析查看器", url: "https://tool.qlsmc.xyz/weatherchart" },
      { title: "热带气旋资料", url: "https://tcdata.typhoon.org.cn/" },
      { title: "GRAPES GFS", url: "http://www.wmc-bj.net/publish/Weather-Models/GRAPES_GFS_new/2.html" },
      { title: "X-MOL", url: "https://www.x-mol.com/" },
      { title: "ReadPaper", url: "https://readpaper.com/new" },
      { title: "Connected Papers", url: "https://www.connectedpapers.com/" },
      { title: "Semantic Scholar", url: "https://www.semanticscholar.org" },
      { title: "百度学术", url: "https://xueshu.baidu.com" },
      { title: "Perplexity", url: "https://www.perplexity.ai" },
      { title: "Papers with Code", url: "https://paperswithcode.com" }
    ];
  </script>
  <script src="app.js"></script>
</body>
</html>
